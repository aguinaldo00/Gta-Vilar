# Publishes the game on GitHub Pages, where the live radio stations play inside the game
# (the claude.ai viewer refuses audio from other sites). To switch it on once:
# Settings → Pages → Source: "GitHub Actions"; if the branch is not the default one,
# Settings → Environments → github-pages → allow this branch.
name: Pages

on:
  push:
    branches: [main, claude/villarcayo-gta-sandbox-ngzn7p]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
